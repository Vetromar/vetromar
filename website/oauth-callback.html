<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connecting your source — Vetromar</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="stylesheet" href="css/site.css" />
  <link rel="stylesheet" href="css/forms.css" />
</head>
<body>
  <div class="page">
    <a class="brand" href="/">
      <img class="logo" src="assets/logo.svg" alt="" />
      Vetromar
    </a>

    <div class="form-card success" style="display: block">
      <h1 id="headline">Finishing authorization…</h1>
      <p id="detail">Handing the connection back to Vetromar on your computer.</p>
      <p id="manual" style="display: none">
        If nothing happens, make sure the Vetromar app is open and the
        connection is still waiting, then
        <a id="continue" href="#">continue manually</a>. If the wait timed out,
        just run Connect again from the Sources tab.
      </p>
    </div>
  </div>

  <script>
    // OAuth redirect relay: some providers (Slack among them) refuse
    // http://localhost redirect URLs, so their consent redirects land here
    // over HTTPS and this page immediately bounces the authorization
    // response to the Vetromar app's local callback server. The code/state
    // go straight to the user's own machine — nothing is sent to or stored
    // on vetromar.com (this page is static).
    var LOCAL_CALLBACK = "http://localhost:4747/callback";
    var qs = window.location.search;
    if (qs && qs.length > 1) {
      var target = LOCAL_CALLBACK + qs;
      document.getElementById("continue").href = target;
      // Leave the manual link visible in case the app isn't listening.
      setTimeout(function () {
        document.getElementById("manual").style.display = "block";
      }, 2500);
      window.location.replace(target);
    } else {
      document.getElementById("headline").textContent = "Nothing to connect";
      document.getElementById("detail").textContent =
        "This page finishes a source authorization started from the Vetromar app — open the app's Sources tab and click Connect to begin one.";
    }
  </script>
</body>
</html>
