[project]
name = "vetromar"
version = "0.6.0"
description = "Local-first knowledge engine: evidence-gated decision graph from meetings and sources, queryable over MCP"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "anthropic>=0.40",
    # BYO providers: any OpenAI-compatible endpoint (OpenAI, OpenRouter,
    # Groq, Ollama /v1, LM Studio, vLLM, LiteLLM proxies) via one SDK.
    "openai>=1.40",
    "ollama>=0.4",
    "mcp>=1.9,<2",
    # Workspace sync client (vetromar/workspace) talks to a self-hosted graph host.
    "httpx>=0.27",
    # Retrieval: local ONNX embeddings + SQL cosine search. Core, not an
    # extra — "queryable by the customer's agent" is the product.
    "fastembed>=0.5",
    "sqlite-vec>=0.1.6",
    # Identity: the local Ed25519 keypair (vetromar/identity.py) and the
    # host server's signature verification both ride on this.
    "cryptography>=42",
]

[project.optional-dependencies]
# Heavy audio/ML pipeline deps — only needed to run capture (stages 1-3).
# Everything downstream (schema, store, extraction backends, render, MCP) works without them.
capture = [
    "whisperx>=3.8.6",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "numpy",
]
# Local HTTP API behind the desktop UI (stays local; light next to torch).
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
# Local document parsing (PDF/DOCX upload). Pure Python, BSD/MIT — negligible
# in the PyInstaller bundle next to torch.
documents = [
    "pypdf>=4",
    "python-docx>=1",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# The graph host server (keypair principals + replication log). Runs headless
# via `python -m cloud`, and ships inside the desktop sidecar for embedded Host
# mode — `vetromar/hosting/` imports it lazily (see vetromar-sidecar.spec).
cloud = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
]

[project.scripts]
vetromar = "vetromar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vetromar", "cloud"]
